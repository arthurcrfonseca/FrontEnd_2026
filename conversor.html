<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Conversor de Temperatura</title>

  <style>

    body{
      font-family: Arial;
      background-color: #f2f2f2;
      text-align: center;
      margin-top: 100px;
    }

    .caixa{
      background-color: white;
      width: 300px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
    }

    input{
      width: 90%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
      font-size: 18px;
    }

    h1{
      color: #333;
    }

    label{
      font-size: 18px;
      font-weight: bold;
    }

  </style>

</head>
<body>

  <div class="caixa">

    <h1>Conversor</h1>

    <label>Celsius (°C)</label><br>
    <input type="number" id="celsius" step="0.1">

    <br>

    <label>Fahrenheit (°F)</label><br>
    <input type="number" id="fahrenheit" step="0.1">

  </div>

  <script>

    let celsius = document.getElementById("celsius");
    let fahrenheit = document.getElementById("fahrenheit");

    // Celsius para Fahrenheit
    celsius.addEventListener("input", function(){

      let c = parseFloat(celsius.value);

      if(isNaN(c)){
        fahrenheit.value = "";
        return;
      }

      let f = (c * 9/5) + 32;

      fahrenheit.value = f.toFixed(2);

    });

    // Fahrenheit para Celsius
    fahrenheit.addEventListener("input", function(){

      let f = parseFloat(fahrenheit.value);

      if(isNaN(f)){
        celsius.value = "";
        return;
      }

      let c = (f - 32) * 5/9;

      celsius.value = c.toFixed(2);

    });

  </script>

</body>
</html>

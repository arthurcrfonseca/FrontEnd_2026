<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Validador de CPF</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 320px;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 15px;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .valido {
      color: green;
    }

    .invalido {
      color: red;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Validador de CPF</h1>

    <input 
      type="text" 
      id="cpf" 
      placeholder="Digite o CPF"
      maxlength="14"
    />

    <button onclick="validarCPF()">Validar</button>

    <div id="resultado"></div>
  </div>

  <script>
    function validarCPF() {
      const cpfInput = document.getElementById("cpf").value;
      const resultado = document.getElementById("resultado");

      // Remove pontos e traços
      const cpf = cpfInput.replace(/\D/g, '');

      // Verifica tamanho e sequência repetida
      if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) {
        mostrarResultado(false);
        return;
      }

      // ===== 1º dígito =====
      let soma = 0;

      for (let i = 0; i < 9; i++) {
        soma += parseInt(cpf[i]) * (10 - i);
      }

      let digito1 = (soma * 10) % 11;

      if (digito1 === 10) {
        digito1 = 0;
      }

      // ===== 2º dígito =====
      soma = 0;

      for (let i = 0; i < 10; i++) {
        soma += parseInt(cpf[i]) * (11 - i);
      }

      let digito2 = (soma * 10) % 11;

      if (digito2 === 10) {
        digito2 = 0;
      }

      // Verifica se os dígitos calculados batem
      if (
        digito1 === parseInt(cpf[9]) &&
        digito2 === parseInt(cpf[10])
      ) {
        mostrarResultado(true);
      } else {
        mostrarResultado(false);
      }
    }

    function mostrarResultado(valido) {
      const resultado = document.getElementById("resultado");

      if (valido) {
        resultado.textContent = "CPF Válido!";
        resultado.className = "valido";
      } else {
        resultado.textContent = "CPF Inválido!";
        resultado.className = "invalido";
      }
    }
  </script>

</body>
</html>

<title>Craque da Seleção Brasileira</title>
<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #009c3b 0%, #002776 50%, #ffcc00 100%);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height:100vh;
}
.container-jogador{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.card-jogador{
    width:850px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
    transition:0.3s;
}
.card-jogador:hover{
    transform:scale(1.02);
}
.cabecalho{
    background:#009c3b;
    color:white;
    text-align:center;
    padding:15px;
}
.conteudo{
    display:flex;
    flex-wrap:wrap;
}
.imagem{
    flex:1;
    min-width:300px;
}
.imagem img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.info{
    flex:1;
    padding:25px;
}
.info h2{
    color:#009c3b;
}
.lista-info{
    list-style:none;
    padding:0;
}
.lista-info li{
    margin-bottom:10px;
    font-size:18px;
}
.curiosidade{
    background:#fff7cc;
    padding:10px;
    border-left:5px solid #ffcc00;
    margin-top:20px;
}
.botao{
    text-align:center;
    padding:20px;
}
.btn{
    background-color:#009c3b;
    color:white;
    border:none;
    padding:12px 30px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}
.btn:hover{
    background-color:#007a2e;
    transform:scale(1.05);
}
</style>
</head>
